services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - dokploy-network
      - default

  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-svakosh}
    ports:
      - "37017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default

  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-svakosh}
    networks:
      - default
    entrypoint:
      - bash
      - -c
      - |
        set -e
        for i in $$(seq 1 30); do
          mongosh --quiet --host mongodb --port 27017 -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" \
            --authenticationDatabase admin --eval 'db.adminCommand("ping")' >/dev/null 2>&1 && break
          sleep 2
        done
        mongosh --quiet --host mongodb --port 27017 -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" \
          --authenticationDatabase admin --eval '
          const name = process.env.MONGODB_DB_NAME;
          const user = process.env.MONGO_APP_USER;
          const appdb = db.getSiblingDB(name);
          const roles = [{ role: "readWrite", db: name }];
          if (appdb.getUser(user)) {
            appdb.updateUser(user, { pwd: process.env.MONGO_APP_PASSWORD, roles: roles });
            print("app user synced");
          } else {
            appdb.createUser({ user: user, pwd: process.env.MONGO_APP_PASSWORD, roles: roles });
            print("app user created");
          }
        '

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - >
        exec redis-server
        --appendonly yes
        --requirepass "$$REDIS_PASSWORD"
        --protected-mode no
        --rename-command CONFIG ""
        --rename-command FLUSHALL ""
        --rename-command FLUSHDB ""
        --rename-command MODULE ""
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "36379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default

volumes:
  mongo_data:
  redis_data:

networks:
  dokploy-network:
    external: true
